<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Suivi Bout Chaud — SGD Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; background: #eaf1f5; color: #1c2733;
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  }
  #chargement { padding: 40px 24px; text-align: center; color: #5c6a7a; font-size: 15px; }
</style>
</head>
<body>
<div id="chargement">Chargement…</div>

<!--
  Cette page ne contient rien : tout le contenu est dans app.js, appele
  ci-dessous avec un parametre different a chaque visite. Le navigateur ne
  peut donc jamais servir une version perimee, et il n'y a plus besoin de
  rafraichir a la main.

  Pour modifier l'affichage, remplacer app.js. Ce fichier ne bouge plus.
-->
<script>
  var a = document.createElement("script");
  a.src = "app.js?" + Date.now();
  a.onerror = function () {
    document.getElementById("chargement").textContent =
      "Le contenu de la page n'a pas pu etre charge.";
  };
  document.body.appendChild(a);
</script>
</body>
</html>
